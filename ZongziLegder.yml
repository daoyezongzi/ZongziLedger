    - data:
        code: "def main(\n    entry: dict = None,\n    clean_structured: dict = None,\n\
          \    clean_text: str = \"\",\n    store_name: str = \"\",\n    clean_s:\
          \ dict = None\n) -> dict:\n    import json\n    import re\n    import hashlib\n\
          \    from datetime import datetime\n\n    def s(v):\n        return str(v\
          \ or \"\").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\
          \n    def to_list(v):\n        if isinstance(v, list):\n            return\
          \ [s(x) for x in v if s(x)]\n        t = s(v)\n        return [t] if t else\
          \ []\n\n    # 兼容你节点里可能传 clean_s\n    if clean_structured is None and isinstance(clean_s,\
          \ dict):\n        clean_structured = clean_s\n\n    def extract_block(st,\
          \ txt, fallback):\n        warnings = []\n        block = \"\"\n       \
          \ llm_store_name = \"\"\n        remark_prefix = \"\"\n\n        if isinstance(st,\
          \ dict):\n            block = s(st.get(\"normalized_block\") or st.get(\"\
          message\") or st.get(\"content\"))\n            llm_store_name = s(st.get(\"\
          store_name\"))\n            remark_prefix = s(st.get(\"remark_prefix\"))\n\
          \            warnings = to_list(st.get(\"warnings\", []))\n        elif\
          \ isinstance(st, str):\n            t = s(st)\n            if t.startswith(\"\
          {\") and t.endswith(\"}\"):\n                try:\n                    obj\
          \ = json.loads(t)\n                    if isinstance(obj, dict):\n     \
          \                   block = s(obj.get(\"normalized_block\") or obj.get(\"\
          message\") or obj.get(\"content\"))\n                        llm_store_name\
          \ = s(obj.get(\"store_name\"))\n                        remark_prefix =\
          \ s(obj.get(\"remark_prefix\"))\n                        warnings = to_list(obj.get(\"\
          warnings\", []))\n                except Exception:\n                  \
          \  block = t\n            else:\n                block = t\n\n        if\
          \ not block:\n            block = s(txt)\n        if not block:\n      \
          \      block = s(fallback)\n\n        return block, warnings, llm_store_name,\
          \ remark_prefix\n\n    # 候选判定：有店名、或有至少1条“品名+数量”行\n    ITEM_LINE_RE = re.compile(r\"\
          .*?[\\u4e00-\\u9fa5A-Za-z0-9].*?\\d+(?:\\.\\d+)?\\s*(?:件|箱|瓶|包|提)?\\s*$\"\
          )\n\n    def is_candidate(lines, merged_store_name):\n        if s(merged_store_name):\n\
          \            return True\n        hit = 0\n        for ln in lines:\n  \
          \          if ITEM_LINE_RE.match(ln):\n                hit += 1\n      \
          \  return hit >= 1\n\n    def ensure_block(text):\n        lines = [x.strip()\
          \ for x in s(text).split(\"\\n\") if x.strip()]\n        if not lines:\n\
          \            return \"\", 0\n\n        # 去掉已有头尾，后面统一重建\n        if lines\
          \ and lines[0].lstrip(\"#＃\").strip() == \"记账\":\n            lines = lines[1:]\n\
          \        if lines and lines[-1] == \"结束\":\n            lines = lines[:-1]\n\
          \n        # 统计商品命中\n        item_hits = sum(1 for x in lines if ITEM_LINE_RE.match(x))\n\
          \        if item_hits < 1:\n            return \"\", item_hits\n\n     \
          \   out = [\"#记账\"] + lines + [\"结束\"]\n        return \"\\n\".join(out),\
          \ item_hits\n\n    e = entry if isinstance(entry, dict) else {}\n    now\
          \ = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n    raw_block, warnings,\
          \ store_name_from_llm, remark_prefix = extract_block(\n        clean_structured,\
          \ clean_text, e.get(\"message\")\n    )\n\n    ts = s(e.get(\"timestamp\"\
          )) or now\n    sid = s(e.get(\"source_id\")) or \"dify\"\n    captured =\
          \ s(e.get(\"message_captured_at\")) or now\n    name = s(e.get(\"name\"\
          ))\n    merged_store_name = s(e.get(\"store_name\")) or s(store_name) or\
          \ store_name_from_llm\n\n    lines_for_judge = [x.strip() for x in s(raw_block).split(\"\
          \\n\") if x.strip()]\n    if not is_candidate(lines_for_judge, merged_store_name):\n\
          \        warnings = warnings + [\"non-ledger message\"]\n        return\
          \ {\n            \"result_item\": {\n                \"is_candidate\": False,\n\
          \                \"normalized_block\": \"\",\n                \"message\"\
          : \"\",\n                \"timestamp\": ts,\n                \"source_id\"\
          : sid,\n                \"message_hash\": s(e.get(\"message_hash\")),\n\
          \                \"message_captured_at\": captured,\n                \"\
          name\": name,\n                \"store_name\": merged_store_name,\n    \
          \            \"remark_prefix\": remark_prefix,\n                \"warnings\"\
          : warnings,\n                \"skip_reason\": \"non_candidate\",\n     \
          \           \"item_hits\": 0,\n            }\n        }\n\n    normalized_block,\
          \ item_hits = ensure_block(raw_block)\n    base_for_hash = normalized_block\
          \ or s(e.get(\"message\"))\n    mhash = s(e.get(\"message_hash\")) or (\n\
          \        hashlib.sha1(base_for_hash.encode(\"utf-8\", errors=\"ignore\"\
          )).hexdigest()\n        if base_for_hash else \"\"\n    )\n\n    if not\
          \ normalized_block:\n        warnings = warnings + [\"candidate but no parseable\
          \ item lines\"]\n        return {\n            \"result_item\": {\n    \
          \            \"is_candidate\": False,\n                \"normalized_block\"\
          : \"\",\n                \"message\": \"\",\n                \"timestamp\"\
          : ts,\n                \"source_id\": sid,\n                \"message_hash\"\
          : mhash,\n                \"message_captured_at\": captured,\n         \
          \       \"name\": name,\n                \"store_name\": merged_store_name,\n\
          \                \"remark_prefix\": remark_prefix,\n                \"warnings\"\
          : warnings,\n                \"skip_reason\": \"no_items\",\n          \
          \      \"item_hits\": item_hits,\n            }\n        }\n\n    return\
          \ {\n        \"result_item\": {\n            \"is_candidate\": True,\n \
          \           \"normalized_block\": normalized_block,\n            \"message\"\
          : normalized_block,\n            \"timestamp\": ts,\n            \"source_id\"\
          : sid,\n            \"message_hash\": mhash,\n            \"message_captured_at\"\
          : captured,\n            \"name\": name,\n            \"store_name\": merged_store_name,\n\
          \            \"remark_prefix\": remark_prefix,\n            \"warnings\"\
          : warnings,\n            \"normalize_mode\": \"candidate_wrapped\",\n  \
          \          \"item_hits\": item_hits,\n        }\n    }"
