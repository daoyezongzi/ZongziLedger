        code: "def unwrap(x):\n    if isinstance(x, dict) and isinstance(x.get(\"\
          result_item\"), dict):\n        return x[\"result_item\"]\n    return x\
          \ if isinstance(x, dict) else {}\n\ndef s(v):\n    return str(v or \"\"\
          ).strip()\n\ndef main(iter_items: list = None) -> dict:\n    rows = [unwrap(x)\
          \ for x in (iter_items or [])]\n    rows = [x for x in rows if x]\n\n  \
          \  normalized_messages = []\n    skipped_non_candidate = 0\n    skipped_empty\
          \ = 0\n\n    for x in rows:\n        if x.get(\"is_candidate\") is False:\n\
          \            skipped_non_candidate += 1\n            continue\n\n      \
          \  msg = s(x.get(\"normalized_block\") or x.get(\"message\"))\n        if\
          \ not msg:\n            skipped_empty += 1\n            continue\n\n   \
          \     normalized_messages.append({\n            \"message\": msg,\n    \
          \        \"normalized_block\": msg,\n            \"timestamp\": s(x.get(\"\
          timestamp\")),\n            \"source_id\": s(x.get(\"source_id\")) or \"\
          dify\",\n            \"message_hash\": s(x.get(\"message_hash\")),\n   \
          \         \"message_captured_at\": s(x.get(\"message_captured_at\")),\n\
          \            \"name\": s(x.get(\"name\")),\n            \"store_name\":\
          \ s(x.get(\"store_name\")),\n            \"remark_prefix\": s(x.get(\"remark_prefix\"\
          )),\n            \"warnings\": x.get(\"warnings\", []) if isinstance(x.get(\"\
          warnings\"), list) else [],\n            \"normalize_mode\": s(x.get(\"\
          normalize_mode\")),\n            \"item_hits\": int(x.get(\"item_hits\"\
          ) or 0),\n        })\n\n    return {\n        \"normalized_messages\": normalized_messages,\n\
          \        \"normalization_summary\": {\n            \"schema_version\": \"\
          zongziledger-dify-clean-v3\",\n            \"input_messages_count\": len(rows),\n\
          \            \"normalized_count\": len(normalized_messages),\n         \
          \   \"skipped_non_candidate_count\": skipped_non_candidate,\n          \
          \  \"skipped_empty_message_count\": skipped_empty\n        },\n    }"
