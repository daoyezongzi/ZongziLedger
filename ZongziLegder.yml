    - data:
        code: "def main(payload_json: str = \"\", messages_json: str = \"\", query:\
          \ str = \"\") -> dict:\n    import json\n    import hashlib\n    from datetime\
          \ import datetime\n\n    LIST_KEYS = (\n        \"messages\", \"normalized_messages\"\
          , \"normalized_block\", \"normalized_blocks\",\n        \"candidate_results\"\
          , \"candidate_messages\", \"ledger_messages\", \"records\", \"items\"\n\
          \    )\n\n    def s(v):\n        return str(v or \"\").replace(\"\\r\\n\"\
          , \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n    def loads_any(v):\n\
          \        if isinstance(v, (dict, list)):\n            return v\n       \
          \ text = s(v)\n        if not text:\n            return None\n        try:\n\
          \            return json.loads(text)\n        except Exception:\n      \
          \      return None\n\n    def pick_text(obj, keys):\n        if not isinstance(obj,\
          \ dict):\n            return \"\"\n        for k in keys:\n            val\
          \ = obj.get(k)\n            if val is None:\n                continue\n\
          \            if isinstance(val, str):\n                t = s(val)\n    \
          \            if t:\n                    return t\n            elif isinstance(val,\
          \ (int, float, bool)):\n                return s(val)\n        return \"\
          \"\n\n    def pick_list(x):\n        if isinstance(x, list):\n         \
          \   return x\n        if not isinstance(x, dict):\n            return []\n\
          \        for k in LIST_KEYS:\n            v = x.get(k)\n            if isinstance(v,\
          \ list):\n                return v\n        for k in (\"data\", \"outputs\"\
          , \"result\", \"payload\"):\n            sub = pick_list(x.get(k))\n   \
          \         if sub:\n                return sub\n        if pick_text(x, (\"\
          message\", \"normalized_block\", \"cleaned_message\", \"raw_message\", \"\
          text\", \"content\")):\n            return [x]\n        return []\n\n  \
          \  payload_obj = loads_any(payload_json)\n    messages_obj = loads_any(messages_json)\n\
          \n    entries = pick_list(messages_obj) or pick_list(payload_obj)\n\n  \
          \  now = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    top_source\
          \ = pick_text(payload_obj if isinstance(payload_obj, dict) else {}, (\"\
          source_id\", \"chat_name\", \"chat_id\", \"source\"))\n\n    raw_messages\
          \ = []\n    for e in entries:\n        row = e if isinstance(e, dict) else\
          \ {\"message\": e}\n        msg = pick_text(row, (\"message\", \"normalized_block\"\
          , \"cleaned_message\", \"raw_message\", \"text\", \"content\"))\n      \
          \  msg = s(msg)\n        if not msg:\n            continue\n\n        ts\
          \ = pick_text(row, (\"timestamp\", \"message_time\", \"created_at\", \"\
          event_time\", \"time\")) or now\n        sid = pick_text(row, (\"source_id\"\
          , \"chat_name\", \"chat_id\", \"conversation_id\", \"source\")) or top_source\
          \ or \"dify\"\n        mhash = pick_text(row, (\"message_hash\", \"hash\"\
          ))\n        if not mhash:\n            mhash = hashlib.sha1(msg.encode(\"\
          utf-8\", errors=\"ignore\")).hexdigest()\n        captured = pick_text(row,\
          \ (\"message_captured_at\", \"captured_at\")) or now\n        name = pick_text(row,\
          \ (\"name\", \"sender\", \"customer_name\", \"buyer_name\", \"contact_name\"\
          ))\n\n        raw_messages.append({\n            \"message\": msg,\n   \
          \         \"timestamp\": ts,\n            \"source_id\": sid,\n        \
          \    \"message_hash\": mhash,\n            \"message_captured_at\": captured,\n\
          \            \"name\": name\n        })\n\n    query_out = s(query) or (raw_messages[0][\"\
          message\"] if raw_messages else \"\")\n    return {\"raw_messages\": raw_messages,\
          \ \"query_out\": query_out}\n"
