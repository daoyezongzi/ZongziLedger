    - data:
        code: "def main(item: dict = None, normalization_context_json: str = \"\"\
          ) -> dict:\n    import re\n    import hashlib\n    from datetime import\
          \ datetime\n\n    ITEM_RE = re.compile(r\".*?\\d+(?:\\.\\d+)?\\s*(?:件|包|袋|箱|瓶|听|支|条|盒|份|杯|个|桶|罐|斤|两|公斤|kg|KG|g|G|l|L|ml|ML|mL|Ml|pcs|PCS)?\\\
          s*$\")\n    HEADER_HINT_RE = re.compile(r\"^[#＃]?\\s*记账(?:\\d{0,8})\\s*$\"\
          )\n    VOLUME_RE = re.compile(r\"^(?:\\d+(?:\\.\\d+)?\\s*[mM]?[lL]|\\d{2,4})$\"\
          )\n\n    def s(v):\n        return str(v or \"\").replace(\"\\r\\n\", \"\
          \\n\").replace(\"\\r\", \"\\n\").strip()\n\n    try:\n        row = item\
          \ if isinstance(item, dict) else {}\n        msg = s(row.get(\"message\"\
          ) or row.get(\"normalized_block\") or row.get(\"cleaned_message\") or row.get(\"\
          raw_message\") or row.get(\"text\") or row.get(\"content\"))\n        now\
          \ = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n        ts = s(row.get(\"\
          timestamp\")) or now\n        sid = s(row.get(\"source_id\")) or \"dify\"\
          \n        mhash = s(row.get(\"message_hash\")) or (hashlib.sha1(msg.encode(\"\
          utf-8\", errors=\"ignore\")).hexdigest() if msg else \"\")\n        captured\
          \ = s(row.get(\"message_captured_at\")) or now\n        name = s(row.get(\"\
          name\") or row.get(\"sender\"))\n\n        lines = [x.strip() for x in msg.split(\"\
          \\n\") if x.strip()]\n        has_start = bool(lines and HEADER_HINT_RE.match(lines[0]))\n\
          \        payload_lines = lines[1:] if has_start else list(lines)\n     \
          \   if payload_lines and payload_lines[-1] in {\"结束\", \"#结束\"}:\n     \
          \       payload_lines = payload_lines[:-1]\n\n        store_name = \"\"\n\
          \        for line in payload_lines:\n            t = line.rstrip(\"：:\"\
          ).strip()\n            if not t or HEADER_HINT_RE.match(t) or VOLUME_RE.fullmatch(t)\
          \ or ITEM_RE.search(t):\n                continue\n            store_name\
          \ = t\n            break\n\n        item_line_hits = sum(1 for x in payload_lines\
          \ if ITEM_RE.search(x))\n        base_candidate = bool(msg) and (has_start\
          \ or item_line_hits >= 1)\n\n        if not base_candidate:\n          \
          \  is_candidate = False\n            skip_reason = \"not_candidate\"\n \
          \       elif not store_name:\n            is_candidate = False\n       \
          \     skip_reason = \"missing_store_line\"\n        else:\n            is_candidate\
          \ = True\n            skip_reason = \"\"\n\n    except Exception:\n    \
          \    now = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        msg =\
          \ \"\"\n        ts = now\n        sid = \"dify\"\n        mhash = \"\"\n\
          \        captured = now\n        name = \"\"\n        store_name = \"\"\n\
          \        is_candidate = False\n        skip_reason = \"candidate_node_exception\"\
          \n\n    entry = {\n        \"message\": msg,\n        \"raw_message\": msg,\n\
          \        \"timestamp\": ts,\n        \"source_id\": sid,\n        \"message_hash\"\
          : mhash,\n        \"message_captured_at\": captured,\n        \"name\":\
          \ name,\n        \"store_name\": store_name,\n    }\n\n    return {\n  \
          \      \"entry\": entry,\n        \"is_candidate\": is_candidate,\n    \
          \    \"skip_reason\": skip_reason,\n        \"llm_input\": msg,\n      \
          \  \"store_name\": store_name,\n    }"
